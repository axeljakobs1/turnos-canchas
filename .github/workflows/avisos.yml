name: Avisos de turnos (21:00 Mendoza)
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 21:00 en Mendoza (Argentina no usa horario de verano)
  workflow_dispatch: {}   # permite correrlo a mano para probar
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node send-reminders.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
